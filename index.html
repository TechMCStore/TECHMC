
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aviator Demo Game</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#10131a;color:white;font-family:Arial,sans-serif}
header{padding:18px;background:#1b2029;text-align:center;font-size:25px;font-weight:bold}
header span{color:#ff4055}
main{max-width:700px;margin:20px auto;padding:12px}
.card{background:#1d222d;padding:18px;border-radius:15px;margin-bottom:15px}
#signup{position:fixed;inset:0;background:#10131a;display:flex;align-items:center;justify-content:center;padding:20px;z-index:5}
.box{width:100%;max-width:360px;background:#202632;padding:24px;border-radius:16px}
input{width:100%;padding:13px;margin:8px 0 14px;background:#11151d;color:white;border:1px solid #454c5a;border-radius:9px;font-size:16px}
button{border:0;padding:13px;border-radius:9px;font-weight:bold;cursor:pointer}
.full{width:100%;background:#31d17c;color:#082514}
.cash{width:100%;background:#ffc247;color:#392600;margin-top:9px}
#game{height:280px;background:radial-gradient(ellipse at bottom,#164632,#111722 70%);border-radius:13px;position:relative;overflow:hidden}
#mult{position:absolute;top:30%;width:100%;text-align:center;font-size:55px;font-weight:bold}
#plane{position:absolute;left:10%;bottom:15%;font-size:38px}
#status{text-align:center;margin-top:12px;color:#d1d6df}
.balance{font-size:26px;color:#31d17c;font-weight:bold}
.small{color:#aab3c2;font-size:13px;line-height:1.5}
</style>
</head>
<body>
<header>✈ <span>AVIATOR</span> DEMO</header>

<div id="signup">
<form class="box" id="form">
<h2>✈ Welcome!</h2>
<p class="small">Create a demo account to play with virtual credits.</p>
<label>Username</label>
<input id="username" required minlength="2" placeholder="Enter username">
<label>Password</label>
<input id="password" type="password" required minlength="4" placeholder="Create password">
<p>🎁 Signup bonus: <b>$500 virtual credits</b></p>
<button class="full" type="submit">SIGN UP & PLAY</button>
</form>
</div>

<main>
<div class="card">
<div class="small">PLAYER: <b id="player">Guest</b></div>
<p>VIRTUAL BALANCE</p>
<div class="balance" id="balance">$500.00</div>
</div>

<div class="card">
<div id="game">
<div id="mult">1.00×</div>
<div id="plane">✈️</div>
</div>
<div id="status">Place a demo bet to start!</div>
</div>

<div class="card">
<label>Bet amount ($ virtual)</label>
<input id="bet" type="number" min="1" value="25">
<button class="full" id="play" onclick="startGame()">▶ PLACE BET</button>
<button class="cash" id="cash" onclick="cashOut()" disabled>💰 CASH OUT</button>
<button onclick="resetGame()" style="width:100%;margin-top:10px;background:#343b49;color:white">RESET $500 DEMO</button>
<p class="small">Entertainment only. No real money, deposits or withdrawals.</p>
</div>
</main>

<script>
let balance=500,playing=false,bet=0,mult=1,start=0,crash=2,frame;
const el=id=>document.getElementById(id);

el("form").addEventListener("submit",function(e){
 e.preventDefault();
 el("player").textContent=el("username").value;
 el("signup").style.display="none";
});

function updateBalance(){
 el("balance").textContent="$"+balance.toFixed(2);
}

function startGame(){
 if(playing)return;
 bet=Number(el("bet").value);
 if(!Number.isFinite(bet)||bet<1||bet>balance){
  el("status").textContent="Enter a valid bet within your balance.";
  return;
 }
 balance-=bet;updateBalance();
 playing=true;mult=1;start=performance.now();
 crash=1.2+Math.random()*4;
 el("play").disabled=true;
 el("cash").disabled=false;
 el("status").textContent="Plane flying! Cash out in time!";
 el("plane").style.left="10%";
 el("plane").style.bottom="15%";
 frame=requestAnimationFrame(tick);
}

function tick(now){
 if(!playing)return;
 let elapsed=(now-start)/1000;
 mult=Math.exp(elapsed*.25);
 if(mult>=crash){
  mult=crash;
  el("mult").textContent=mult.toFixed(2)+"×";
  finish("💥 CRASHED! You lost $"+bet.toFixed(2)+" virtual credits.");
  return;
 }
 el("mult").textContent=mult.toFixed(2)+"×";
 el("plane").style.left=Math.min(80,10+elapsed*10)+"%";
 el("plane").style.bottom=Math.min(75,15+elapsed*6)+"%";
 frame=requestAnimationFrame(tick);
}

function cashOut(){
 if(!playing)return;
 let winnings=bet*mult;
 balance+=winnings;
 updateBalance();
 finish("🎉 CASHED OUT! Won $"+winnings.toFixed(2)+" virtual credits.");
}

function finish(message){
 playing=false;
 cancelAnimationFrame(frame);
 el("status").textContent=message;
 el("play").disabled=false;
 el("cash").disabled=true;
}

function resetGame(){
 playing=false;
 cancelAnimationFrame(frame);
 balance=500;updateBalance();
 el("mult").textContent="1.00×";
 el("plane").style.left="10%";
 el("plane").style.bottom="15%";
 el("status").textContent="Demo reset. Place a bet to start!";
 el("play").disabled=false;
 el("cash").disabled=true;
}
</script>
</body>
</html>
