<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GameZone</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0a1020;color:white;font-family:Arial,sans-serif}
header{padding:18px;background:#111a30;display:flex;
justify-content:space-between;align-items:center}
h1{color:#69f0ae;margin:0;font-size:25px}
main{max-width:900px;margin:30px auto;padding:16px}
.card{background:#141f36;padding:24px;border-radius:16px;
margin-bottom:20px;border:1px solid #293957}
input,button{width:100%;padding:13px;margin:7px 0;
border-radius:9px;border:1px solid #34435e;font-size:16px}
input{background:#0b1426;color:white}
button{background:#69f0ae;color:#07140e;border:0;
font-weight:bold;cursor:pointer}
button:hover{filter:brightness(.9)}
.secondary{background:#293957;color:white}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}
.hidden{display:none}
.muted{color:#afbdd4;line-height:1.6}
#message{color:#ffd180;overflow-wrap:anywhere}
</style>
</head>
<body>
<header>
  <h1>🎮 GameZone</h1>
  <button id="logout" class="secondary hidden"
          style="width:auto">Logout</button>
</header>

<main>
<section id="auth" class="card">
  <h2 id="formTitle">Create account</h2>
  <p class="muted">Join GameZone and play free mini-games.</p>

  <form id="authForm">
    <input id="username" placeholder="Username"
           minlength="3" maxlength="24" required>
    <input id="email" type="email" placeholder="Email address" required>
    <input id="password" type="password"
           placeholder="Password (minimum 8 characters)"
           minlength="8" required>
    <button id="submitButton" type="submit">Register</button>
  </form>

  <button id="switchMode" class="secondary" type="button">
    Already registered? Login
  </button>
  <p id="message" role="status"></p>
</section>

<section id="dashboard" class="hidden">
  <div class="card">
    <h2>Welcome, <span id="welcome"></span>!</h2>
    <p class="muted">Your free gaming dashboard is ready.</p>
    <h3>⭐ Virtual points: <span id="points">0</span></h3>
  </div>

  <div class="grid">
    <div class="card">
      <h3>🎯 Number Challenge</h3>
      <p class="muted">Guess a number from 1 to 5.</p>
      <input id="guess" type="number" min="1" max="5"
             placeholder="Your guess">
      <button id="guessButton">Play</button>
      <p id="guessResult" class="muted"></p>
    </div>

    <div class="card">
      <h3>🧠 Quick Quiz</h3>
      <p>Which game is famous for blocks?</p>
      <button class="quiz" data-answer="no">Free Fire</button>
      <button class="quiz" data-answer="yes">Minecraft</button>
      <p id="quizResult" class="muted"></p>
    </div>
  </div>
</section>
</main>

<script>
"use strict";

const $ = id => document.getElementById(id);
let mode = "register";
let currentUser = null;
let points = 0;

function showMessage(text) {
  $("message").textContent = text;
}

function showAuth() {
  $("auth").classList.remove("hidden");
  $("dashboard").classList.add("hidden");
  $("logout").classList.add("hidden");
}

function showDashboard() {
  $("auth").classList.add("hidden");
  $("dashboard").classList.remove("hidden");
  $("logout").classList.remove("hidden");
  $("welcome").textContent = currentUser.username;
  $("points").textContent = points;
}

function setMode(nextMode) {
  mode = nextMode;
  $("formTitle").textContent =
    mode === "register" ? "Create account" : "Login";
  $("submitButton").textContent =
    mode === "register" ? "Register" : "Login";
  $("switchMode").textContent =
    mode === "register"
      ? "Already registered? Login"
      : "New here? Create account";
  $("username").classList.toggle("hidden", mode === "login");
  $("username").required = mode === "register";
  $("password").value = "";
  showMessage("");
}

$("switchMode").addEventListener("click", () => {
  setMode(mode === "register" ? "login" : "register");
});

$("authForm").addEventListener("submit", async event => {
  event.preventDefault();
  showMessage("Processing...");

  const email = $("email").value.trim().toLowerCase();
  const password = $("password").value;
  const username = $("username").value.trim();

  try {
    if (mode === "register") {
      // Demo only: browser storage is NOT secure authentication.
      const key = "gamezone_demo_users";
      const users = JSON.parse(localStorage.getItem(key) || "{}");

      if (users[email]) {
        showMessage("Account already exists. Please login.");
        return;
      }

      // Never use this demo for real accounts or real passwords.
      // Passwords are deliberately NOT saved.
      showMessage(
        "This demo cannot safely register accounts. " +
        "Connect Firebase Authentication to enable secure registration."
      );
    } else {
      showMessage(
        "Secure login is not configured yet. " +
        "Connect Firebase Authentication first."
      );
    }
  } catch (error) {
    showMessage("Storage unavailable. Please try another browser.");
  }
});

$("logout").addEventListener("click", () => {
  currentUser = null;
  points = 0;
  showAuth();
  setMode("login");
});

$("guessButton").addEventListener("click", () => {
  const guess = Number($("guess").value);

  if (!Number.isInteger(guess) || guess < 1 || guess > 5) {
    $("guessResult").textContent = "Enter a number from 1 to 5.";
    return;
  }

  const answer = Math.floor(Math.random() * 5) + 1;

  if (guess === answer) {
    points += 10;
    $("guessResult").textContent =
      "Correct! You earned 10 virtual points.";
  } else {
    $("guessResult").textContent =
      "The number was " + answer + ". Try again!";
  }

  $("points").textContent = points;
});

document.querySelectorAll(".quiz").forEach(button => {
  button.addEventListener("click", () => {
    if (button.dataset.answer === "yes") {
      points += 5;
      $("quizResult").textContent = "Correct! +5 virtual points.";
      $("points").textContent = points;
    } else {
      $("quizResult").textContent = "Try again!";
    }
  });
});

setMode("register");
showAuth();
</script>
</body>
</html>
