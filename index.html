
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nova AI - Your AI Assistant</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: Arial, sans-serif;
  background: #212121;
  color: #f5f5f5;
  height: 100dvh;
  display: flex;
  overflow: hidden;
}

.sidebar {
  width: 250px;
  background: #171717;
  padding: 18px;
  display: flex;
  flex-direction: column;
  gap: 15px;
}

.logo {
  font-size: 24px;
  font-weight: bold;
  color: #a78bfa;
  margin: 8px 0 18px;
}

.new-chat {
  padding: 13px;
  background: #262626;
  border: 1px solid #444;
  border-radius: 12px;
  color: white;
  text-align: left;
  cursor: pointer;
}

.new-chat:hover {
  background: #333;
}

.side-note {
  margin-top: auto;
  color: #999;
  font-size: 12px;
  line-height: 1.6;
}

.main {
  flex: 1;
  display: flex;
  flex-direction: column;
  min-width: 0;
}

header {
  height: 62px;
  padding: 0 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid #333;
}

header strong {
  font-size: 17px;
}

.status {
  color: #aaa;
  font-size: 12px;
}

.chat {
  flex: 1;
  overflow-y: auto;
  padding: 28px 16px;
  display: flex;
  flex-direction: column;
  gap: 22px;
}

.welcome {
  margin: auto;
  text-align: center;
  padding: 20px 0;
}

.welcome .star {
  font-size: 45px;
  margin-bottom: 18px;
}

.welcome h1 {
  font-size: clamp(25px, 5vw, 36px);
  margin-bottom: 12px;
}

.welcome p {
  color: #aaa;
  line-height: 1.6;
}

.message {
  width: 100%;
  max-width: 760px;
  margin: 0 auto;
  line-height: 1.75;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

.user {
  background: #303030;
  padding: 12px 16px;
  border-radius: 18px;
  max-width: min(85%, 650px);
  align-self: flex-end;
}

.bot {
  align-self: center;
}

.bot-label {
  color: #c4b5fd;
  font-weight: bold;
  font-size: 13px;
  margin-bottom: 7px;
}

.composer-wrap {
  padding: 12px 16px 16px;
  width: 100%;
  max-width: 800px;
  margin: 0 auto;
}

.composer {
  display: flex;
  align-items: flex-end;
  gap: 10px;
  padding: 10px;
  background: #303030;
  border: 1px solid #505050;
  border-radius: 20px;
}

textarea {
  flex: 1;
  background: transparent;
  color: white;
  border: none;
  outline: none;
  resize: none;
  font: inherit;
  padding: 8px;
  max-height: 150px;
  min-width: 0;
}

textarea::placeholder {
  color: #aaa;
}

.send {
  border: none;
  background: #a78bfa;
  color: #171717;
  border-radius: 12px;
  width: 42px;
  height: 42px;
  font-size: 21px;
  cursor: pointer;
  flex-shrink: 0;
}

.send:disabled {
  opacity: .45;
  cursor: not-allowed;
}

.disclaimer {
  text-align: center;
  color: #888;
  font-size: 11px;
  margin-top: 10px;
}

.menu-btn {
  display: none;
  background: transparent;
  border: none;
  color: white;
  font-size: 22px;
}

@media (max-width: 650px) {
  .sidebar {
    display: none;
  }

  .menu-btn {
    display: block;
  }

  header {
    padding: 0 14px;
  }

  .chat {
    padding: 22px 14px;
  }

  .composer-wrap {
    padding: 10px;
  }
}
</style>
</head>

<body>

<aside class="sidebar">
  <div class="logo">✦ Nova AI</div>
  <button class="new-chat" id="newChat">＋ New Chat</button>
  <div class="side-note">
    Your AI assistant<br>
    Ask questions. Learn. Create.<br><br>
    Built with HTML, CSS & JS
  </div>
</aside>

<main class="main">
  <header>
    <button class="menu-btn" id="menuBtn">☰</button>
    <strong>Nova AI</strong>
    <span class="status">AI Assistant</span>
  </header>

  <section class="chat" id="chat" aria-live="polite">
    <div class="welcome" id="welcome">
      <div class="star">✦</div>
      <h1>What can I help with?</h1>
      <p>Ask anything. Start a conversation with Nova AI.</p>
    </div>
  </section>

  <div class="composer-wrap">
    <form class="composer" id="chatForm">
      <textarea
        id="prompt"
        placeholder="Message Nova AI..."
        rows="1"
        aria-label="Your message"
        required
      ></textarea>
      <button class="send" id="sendBtn" type="submit"
        aria-label="Send message">↑</button>
    </form>
    <p class="disclaimer">
      AI can make mistakes. Verify important information.
    </p>
  </div>
</main>

<script>
const chat = document.getElementById("chat");
const form = document.getElementById("chatForm");
const promptBox = document.getElementById("prompt");
const sendBtn = document.getElementById("sendBtn");
const welcome = document.getElementById("welcome");
const newChat = document.getElementById("newChat");
const menuBtn = document.getElementById("menuBtn");

let history = [];
let busy = false;

function addMessage(text, type) {
  const box = document.createElement("div");
  box.className = "message " + type;

  if (type === "bot") {
    const label = document.createElement("div");
    label.className = "bot-label";
    label.textContent = "✦ Nova AI";
    box.appendChild(label);
  }

  const content = document.createElement("div");
  content.textContent = text;
  box.appendChild(content);

  chat.appendChild(box);
  chat.scrollTop = chat.scrollHeight;
  return content;
}

function resizeInput() {
  promptBox.style.height = "auto";
  promptBox.style.height =
    Math.min(promptBox.scrollHeight, 150) + "px";
}

promptBox.addEventListener("input", resizeInput);

promptBox.addEventListener("keydown", event => {
  if (event.key === "Enter" && !event.shiftKey) {
    event.preventDefault();
    form.requestSubmit();
  }
});

form.addEventListener("submit", async event => {
  event.preventDefault();

  const text = promptBox.value.trim();
  if (!text || busy) return;

  welcome?.remove();

  addMessage(text, "user");
  promptBox.value = "";
  resizeInput();

  const reply = addMessage("Thinking...", "bot");
  busy = true;
  sendBtn.disabled = true;

  try {
    // Your secure backend must provide this endpoint.
    const response = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        message: text,
        history: history
      })
    });

    if (!response.ok) {
      throw new Error(
        response.status === 404
          ? "AI backend is not connected yet. Set up the /api/chat endpoint."
          : "AI request failed. Please try again."
      );
    }

    const data = await response.json();

    if (typeof data.reply !== "string") {
      throw new Error("Invalid reply from AI server.");
    }

    reply.textContent = data.reply;

    history.push(
      { role: "user", content: text },
      { role: "assistant", content: data.reply }
    );

    // Keep recent context from growing without limit.
    history = history.slice(-20);

  } catch (error) {
    reply.textContent =
      "⚠️ " + error.message;
  } finally {
    busy = false;
    sendBtn.disabled = false;
    promptBox.focus();
    chat.scrollTop = chat.scrollHeight;
  }
});

newChat.addEventListener("click", resetChat);

function resetChat() {
  history = [];
  chat.replaceChildren();

  const panel = document.createElement("div");
  panel.className = "welcome";
  panel.id = "welcome";
  panel.innerHTML =
    '<div class="star">✦</div>' +
    '<h1>What can I help with?</h1>' +
    '<p>Ask anything. Start a conversation with Nova AI.</p>';

  chat.appendChild(panel);
  promptBox.value = "";
  resizeInput();
}

menuBtn.addEventListener("click", () => {
  const sidebar = document.querySelector(".sidebar");
  const visible = sidebar.style.display === "flex";
  sidebar.style.display = visible ? "none" : "flex";

  if (!visible) {
    sidebar.style.position = "absolute";
    sidebar.style.zIndex = "5";
    sidebar.style.height = "100dvh";
  } else {
    sidebar.style.position = "";
    sidebar.style.zIndex = "";
    sidebar.style.height = "";
  }
});
</script>

</body>
</html>
