
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nova AI</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101114;color:#fff;font-family:Arial,sans-serif}
header{padding:16px 20px;border-bottom:1px solid #292a30;display:flex;justify-content:space-between;align-items:center}
.logo{font-size:23px;font-weight:bold;color:#b79aff}
main{max-width:850px;margin:auto;padding:22px 16px 150px}
h1{text-align:center;margin-top:60px;font-size:32px}
.sub{text-align:center;color:#aaa;margin-bottom:28px}
#chat{display:flex;flex-direction:column;gap:16px}
.msg{padding:14px 16px;border-radius:18px;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere}
.user{background:#303139;align-self:flex-end;max-width:90%}
.ai{background:#1b1c22;align-self:stretch}
.ai pre{background:#090a0d;padding:12px;border-radius:8px;overflow:auto}
.ai img{max-width:100%;border-radius:10px}
.composer{position:fixed;bottom:0;left:0;width:100%;padding:12px;background:#101114;border-top:1px solid #292a30}
.inner{max-width:850px;margin:auto}
textarea{width:100%;resize:vertical;min-height:60px;max-height:180px;background:#24252b;color:white;border:1px solid #42434c;border-radius:15px;padding:15px;font-size:16px;outline:none}
.actions{display:flex;gap:8px;align-items:center;margin-top:9px;flex-wrap:wrap}
button,.upload{border:0;border-radius:10px;padding:11px 14px;background:#a98aff;color:#17121f;font-weight:bold;cursor:pointer}
.secondary{background:#292a32;color:white}
#status{color:#aaa;font-size:13px;margin-top:7px}
#preview{max-width:90px;max-height:70px;display:none;margin-top:6px}
footer{text-align:center;color:#777;font-size:12px;margin-top:25px}
</style>
</head>
<body>
<header>
  <div class="logo">✦ Nova AI</div>
  <button class="secondary" onclick="clearChat()">New Chat</button>
</header>

<main>
  <h1 id="welcome">What can I help with?</h1>
  <p class="sub">Ask questions · Write code · Explore ideas</p>
  <div id="chat"></div>
  <footer>Nova AI · AI responses may make mistakes.</footer>
</main>

<div class="composer">
  <div class="inner">
    <textarea id="prompt" placeholder="Ask anything, write code, Hindi or English..." onkeydown="keySend(event)"></textarea>
    <img id="preview" alt="Selected image preview">
    <div class="actions">
      <label class="upload secondary">📎 Image
        <input id="image" type="file" accept="image/*" hidden onchange="showImage(event)">
      </label>
      <button class="secondary" onclick="askImage()">🎨 Generate image</button>
      <button onclick="sendMessage()">➤ Send</button>
    </div>
    <div id="status">Connect your AI backend to enable real answers and image generation.</div>
  </div>
</div>

<script>
const chat = document.getElementById("chat");
const promptBox = document.getElementById("prompt");
const statusBox = document.getElementById("status");
let selectedImage = null;

// Set this to your deployed backend URL.
// Example: https://your-worker.your-subdomain.workers.dev
const API_URL = "";

function addMessage(text, who) {
  const div = document.createElement("div");
  div.className = "msg " + who;
  div.textContent = text;
  chat.appendChild(div);
  div.scrollIntoView({behavior:"smooth", block:"end"});
  return div;
}

async function sendMessage() {
  const text = promptBox.value.trim();
  if (!text && !selectedImage) return;

  document.getElementById("welcome").style.display = "none";
  addMessage(text || "Please describe this image.", "user");
  promptBox.value = "";

  const file = selectedImage;
  selectedImage = null;
  document.getElementById("image").value = "";
  document.getElementById("preview").style.display = "none";

  if (!API_URL) {
    addMessage("Nova AI ka backend abhi connect nahi hai. Real AI answers ke liye API_URL mein apne secure backend ka URL set karo.", "ai");
    statusBox.textContent = "Backend not connected";
    return;
  }

  const loading = addMessage("Thinking...", "ai");
  statusBox.textContent = "Connecting to AI...";

  try {
    const form = new FormData();
    form.append("message", text);
    if (file) form.append("image", file);

    const response = await fetch(API_URL + "/chat", {
      method: "POST",
      body: form
    });

    if (!response.ok) throw new Error("AI request failed: " + response.status);
    const data = await response.json();
    loading.textContent = data.reply || "No answer received.";
    statusBox.textContent = "Ready";
  } catch (error) {
    loading.textContent = "AI request failed. Check your backend URL, server logs and API configuration.";
    statusBox.textContent = "Connection error";
  }
}

async function askImage() {
  const text = promptBox.value.trim();
  if (!text) {
    statusBox.textContent = "Pehle image ka description likho.";
    return;
  }

  document.getElementById("welcome").style.display = "none";
  addMessage("🎨 Create image: " + text, "user");
  promptBox.value = "";

  if (!API_URL) {
    addMessage("Image generation ke liye image-capable backend/API connect karni hogi.", "ai");
    return;
  }

  const loading = addMessage("Creating image...", "ai");
  try {
    const response = await fetch(API_URL + "/image", {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify({prompt:text})
    });
    if (!response.ok) throw new Error("Image request failed");
    const data = await response.json();
    loading.textContent = "";
    if (data.imageUrl) {
      const img = document.createElement("img");
      img.src = data.imageUrl;
      img.alt = "AI generated image";
      loading.appendChild(img);
    } else {
      loading.textContent = data.reply || "No image returned.";
    }
  } catch {
    loading.textContent = "Image generation failed. Check the backend and image API.";
  }
}

function showImage(event) {
  selectedImage = event.target.files[0] || null;
  const preview = document.getElementById("preview");
  if (selectedImage) {
    preview.src = URL.createObjectURL(selectedImage);
    preview.style.display = "block";
    statusBox.textContent = "Image selected. Add a question and press Send.";
  }
}

function keySend(event) {
  if (event.key === "Enter" && !event.shiftKey) {
    event.preventDefault();
    sendMessage();
  }
}

function clearChat() {
  chat.replaceChildren();
  document.getElementById("welcome").style.display = "";
  statusBox.textContent = "New chat started";
}

</script>
</body>
</html>
